name: Threads — статистика и ответы под нашими постами
on:
  schedule:
    - cron: '20 * * * *'      # каждый час: новые комментарии под нашими постами
    - cron: '50 20 * * *'     # раз в день: статистика постов
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: threads-stats
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Комментарии
        env: { THREADS_TOKEN: '${{ secrets.THREADS_TOKEN }}' }
        run: python threads/comments.py || true
      - name: Статистика
        if: github.event.schedule == '50 20 * * *' || github.event_name == 'workflow_dispatch'
        env: { THREADS_TOKEN: '${{ secrets.THREADS_TOKEN }}' }
        run: python threads/insights.py || true
      - name: Commit
        run: |
          git config user.name "threads-bot"; git config user.email "threads-bot@users.noreply.github.com"
          git add threads/comments threads/stats 2>/dev/null || true
          git diff --cached --quiet || git commit -m "threads: comments/stats"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
