name: Threads — публикация одобренных ответов

on:
  push:
    branches: [main]
    paths: ['threads/replies/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-autopost
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Опубликовать ответы
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python threads/reply.py
      - name: Отметить опубликованные
        run: |
          git config user.name "renviks-bot"
          git config user.email "renviks-bot@users.noreply.github.com"
          git add threads/replies
          git diff --cached --quiet || (git commit -m "Threads: отмечены опубликованные ответы [skip ci]" && git pull --rebase -q && git push)
