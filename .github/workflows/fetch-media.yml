name: fetch-media
on:
  push:
    paths: ['media/fetch/*.txt']
  workflow_dispatch:
concurrency: repo-autopost
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download listed media
        run: |
          set -e
          for list in media/fetch/*.txt; do
            [ -f "$list" ] || continue
            batch=$(basename "$list" .txt)
            mkdir -p "media/in/$batch"
            while read -r name url; do
              [ -z "$name" ] && continue
              case "$name" in \#*) continue;; esac
              [ -f "media/in/$batch/$name" ] && continue
              curl -fsSL --retry 3 -o "media/in/$batch/$name" "$url"
            done < "$list"
          done
      - name: Commit
        run: |
          git config user.name "media-bot"
          git config user.email "media-bot@users.noreply.github.com"
          git add media/in
          git diff --cached --quiet || git commit -m "media: fetched files"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
