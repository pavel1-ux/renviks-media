name: Threads — поиск постов для ответов

on:
  # расписание выключено: Meta пока не даёт приложению доступ к поиску (threads_keyword_search требует проверки приложения)
  push:
    branches: [main]
    paths: ['threads/leads-run-now.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-autopost
  cancel-in-progress: false

jobs:
  leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Поиск
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python threads/leads.py
      - name: Сохранить
        run: |
          git config user.name "renviks-bot"
          git config user.email "renviks-bot@users.noreply.github.com"
          git add threads/leads
          git diff --cached --quiet || (git commit -m "Threads: подборка постов для ответов" && git pull --rebase -q && git push)
